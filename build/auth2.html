<!DOCTYPE html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>Авторизация и регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.2/iconify-icon.min.js?_v=20260910103549"></script>
    <link rel="stylesheet" href="./libs/css/normalize.css">
    <link rel="stylesheet" href="./libs/css/fancybox.css">
    <link rel="stylesheet" href="./libs/css/nouislider.css">
    <link rel="stylesheet" href="./libs/css/swiper-bundle.min.css">
    <link rel="stylesheet" href="./libs/css/slimselect.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="https://vkusdom.westpower.ru/build/css/additionally.css">
  </head>
  <body>
    <div class="page-flex">
      <div class="auth-page">
        <div class="auth-page__block">
          <div class="auth-page__logo"><a href=""><img src="./img/logo.svg" alt=""></a></div>
          <div class="auth-page__step-1">
            <div class="auth-page__title">Авторизация и регистрация</div>
            <div class="auth-page__form">
              <form action="">
                <div class="form__block auth-page__form-block">
                  <div class="form__label">Введите номер телефона</div>
                  <div class="form__input">
                    <input type="tel" value="" placeholder="+7"><span class="form__input-text">Неверный формат телефона</span>
                  </div>
                </div>
                <div class="auth-page__links"><a class="auth-page__link" href="">Войти через SMS</a><a class="auth-page__link" href="">Войти  по номеру телефона</a></div>
                <div class="auth-page__agree">
                  <label class="custom-checkbox">
                    <input class="custom-checkbox__checkbox" type="checkbox" name="" checked="checked"/><span class="custom-checkbox__span"></span><span class="custom-checkbox__label">Согласие на обработку персональных данных <a href="">Политика обработки персональных данных</a></span>
                  </label>
                </div>
              </form>
            </div>
          </div>
          <div class="auth-page__step-2 hide">
            <div class="auth-page__title">Сделайте телефонный звонок на номер</div>
            <div class="auth-page__phone">+7 (911) 321-54-76</div>
          </div>
        </div>
      </div>
    </div>
    <script src="./libs/js/jquery.min.js"></script>
    <script src="./libs/js/inputmask.min.js"></script>
    <script src="./libs/js/nouislider.js"></script>
    <script src="./libs/js/lightTabs.js"></script>
    <script src="./libs/js/fancybox.umd.js"></script>
    <script src="./libs/js/swiper-bundle.min.js"></script>
    <script src="./libs/js/slimselect.js"></script>
    <script src="./js/main.js"></script>
    <script src="https://vkusdom.westpower.ru/build/js/additionally.js"></script>
  </body>
</html>
