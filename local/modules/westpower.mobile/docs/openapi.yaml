      required:
        - "code"
        - "name"
    Filters:
      type: "object"
      properties:
        filters:
          type: "array"
          items:
            "$ref": "#/components/schemas/Filter"
        sorts:
          type: "array"
          items:
            "$ref": "#/components/schemas/Sort"
      required:
        - "filters"
        - "sorts"
