    ProductList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProductCard"
        pagination:
          "$ref": "#/components/schemas/Pagination"
      required:
        - "items"
        - "pagination"
    FilterValue:
      type: "object"
