          enum:
            - "range"
            - "multiselect"
        min:
          type: "number"
          description: "range"
        max:
          type: "number"
          description: "range"
        values:
          type: "array"
          items:
            "$ref": "#/components/schemas/FilterValue"
          description: "multiselect"
      required:
        - "code"
        - "name"
        - "type"
    Sort:
      type: "object"
      properties:
        code:
