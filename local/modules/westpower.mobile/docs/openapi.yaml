        - "code"
        - "name"
    ProductCard:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        image:
          "$ref": "#/components/schemas/Image"
        price:
          "$ref": "#/components/schemas/Price"
        unit:
          type: "object"
          properties:
            name:
              type: "string"
              example: "шт"
            step:
              type: "number"
              description: "Шаг количества"
              example: 1
          required:
            - "name"
            - "step"
        weight:
          type: "integer"
          nullable: true
          description: "г"
        stock:
          type: "object"
          properties:
            isAvailable:
              type: "boolean"
            quantity:
              type: "number"
              description: "Остаток суммарно по складам"
          required:
            - "isAvailable"
            - "quantity"
        labels:
          type: "array"
          items:
            "$ref": "#/components/schemas/Label"
        brand:
          allOf:
            - "$ref": "#/components/schemas/Ref"
          nullable: true
        isFavorite:
          type: "boolean"
          description: "false без токена и у гостя"
        cartQuantity:
          type: "number"
          description: "Сколько уже в корзине; 0 — нет"
      required:
        - "id"
        - "name"
        - "image"
        - "price"
        - "unit"
        - "weight"
        - "stock"
        - "labels"
        - "brand"
        - "isFavorite"
        - "cartQuantity"
