              type: "integer"
              description: "г"
            transport:
              type: "object"
              properties:
                code:
                  type: "string"
                name:
                  type: "string"
              required:
                - "code"
                - "name"
              nullable: true
            weather:
              type: "object"
              properties:
                code:
                  type: "string"
                name:
                  type: "string"
                coefficient:
                  type: "number"
              required:
                - "code"
                - "name"
                - "coefficient"
              nullable: true
          required:
            - "distance"
            - "weight"
            - "transport"
            - "weather"
      required:
        - "isAvailable"
        - "reason"
        - "price"
        - "isFree"
        - "freeDelivery"
        - "components"
        - "details"
    PaymentMethod:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        isOnline:
          type: "boolean"
      required:
        - "id"
        - "name"
        - "isOnline"
    CheckoutSummary:
      type: "object"
      properties:
        itemsTotal:
          "$ref": "#/components/schemas/Price"
        delivery:
          "$ref": "#/components/schemas/Price"
        total:
          "$ref": "#/components/schemas/Price"
      required:
        - "itemsTotal"
        - "delivery"
        - "total"
    CheckoutCalculation:
      type: "object"
      properties:
        delivery:
          "$ref": "#/components/schemas/DeliveryQuote"
        paymentMethods:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentMethod"
        summary:
          "$ref": "#/components/schemas/CheckoutSummary"
      required:
        - "delivery"
        - "paymentMethods"
        - "summary"
    OrderRequest:
      allOf:
        - "$ref": "#/components/schemas/CheckoutRequest"
        - type: "object"
          properties:
            paymentMethodId:
              type: "integer"
            slot:
              type: "object"
              properties:
                date:
                  type: "string"
                  format: "date"
                id:
                  type: "integer"
              required:
                - "date"
                - "id"
              nullable: true
            replacement:
              type: "string"
              nullable: true
              description: "code из replacementOptions"
            comment:
              type: "string"
              nullable: true
          required:
            - "paymentMethodId"
    Order:
      type: "object"
      properties:
        id:
          type: "integer"
        number:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        status:
          type: "object"
          properties:
            code:
              type: "string"
              enum:
                - "accepted"
                - "paid"
                - "assembling"
                - "ready"
                - "delivering"
                - "completed"
                - "cancelled"
            name:
              type: "string"
          required:
            - "code"
            - "name"
        method:
          type: "object"
          properties:
            code:
              type: "string"
            name:
              type: "string"
          required:
            - "code"
            - "name"
          nullable: true
        pickupPoint:
          type: "object"
          properties:
            id:
              type: "integer"
            name:
              type: "string"
            address:
              type: "string"
          required:
            - "id"
            - "name"
            - "address"
          nullable: true
        address:
          type: "object"
          properties:
            text:
              type: "string"
          required:
            - "text"
          nullable: true
        deliveryTime:
          type: "string"
          nullable: true
          description: "Слот, как записан в заказе (формат согласуется с сайтом)"
        items:
          type: "array"
          items:
            type: "object"
            properties:
              product:
                "$ref": "#/components/schemas/ProductShort"
              quantity:
                type: "number"
              total:
                "$ref": "#/components/schemas/Price"
            required:
              - "product"
              - "quantity"
              - "total"
        summary:
          type: "object"
          properties:
            itemsCount:
              type: "integer"
            quantity:
              type: "number"
            weight:
              type: "integer"
              nullable: true
            itemsTotal:
              "$ref": "#/components/schemas/Price"
            delivery:
              "$ref": "#/components/schemas/Price"
            total:
              "$ref": "#/components/schemas/Price"
          required:
            - "itemsCount"
            - "quantity"
            - "weight"
            - "itemsTotal"
            - "delivery"
            - "total"
        payment:
          type: "object"
          properties:
            method:
              allOf:
                - "$ref": "#/components/schemas/Ref"
              nullable: true
            isPaid:
              type: "boolean"
            isOnline:
              type: "boolean"
          required:
            - "method"
            - "isPaid"
            - "isOnline"
        canPay:
          type: "boolean"
      required:
        - "id"
        - "number"
        - "createdAt"
        - "status"
        - "method"
        - "pickupPoint"
        - "address"
        - "deliveryTime"
        - "items"
        - "summary"
        - "payment"
        - "canPay"
    OrderList:
