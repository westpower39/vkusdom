components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "accessToken из /auth/guest, /auth/login или /auth/refresh"
  parameters:
    Id:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "integer"
    ProductId:
      name: "productId"
      in: "path"
      required: true
      schema:
        type: "integer"
    ProductCollectionCode:
      name: "code"
      in: "path"
      required: true
      schema:
        type: "string"
        enum:
          - "own-production"
          - "prepared"
          - "chemicals"
          - "hits"
          - "new"
          - "healthy"
          - "promo"
    SectionCollectionCode:
      name: "code"
      in: "path"
      required: true
      schema:
        type: "string"
        enum:
          - "popular"
          - "bread"
          - "semi-finished"
    VerificationId:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    PromoCode:
      name: "code"
      in: "path"
      required: true
      schema:
        type: "string"
    DeviceToken:
      name: "token"
      in: "path"
      required: true
      schema:
        type: "string"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
    Sort:
      name: "sort"
      in: "query"
      schema:
        type: "string"
        enum:
          - "popular"
          - "price-asc"
          - "price-desc"
        default: "popular"
    Filter:
      name: "filter"
      in: "query"
      style: "deepObject"
      explode: true
      schema:
        type: "object"
      description: "filter[price][min]=100&filter[price][max]=500&filter[brend][]=<value>. Коды и значения — из …/filters"
    Query:
      name: "query"
      in: "query"
      required: true
      schema:
        type: "string"
        minLength: 2
    Method:
      name: "method"
      in: "query"
      required: true
      schema:
        type: "string"
        enum:
          - "delivery"
          - "pickup"
    PersonType:
      name: "personType"
      in: "query"
      required: true
      schema:
        type: "string"
        enum:
          - "individual"
          - "legal"
  responses:
    ValidationError:
      description: "Неверные параметры"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Параметр limit должен быть от 1 до 50"
                code: "VALIDATION_ERROR"
                customData: null
    Unauthorized:
      description: "Нет токена, токен истёк или нужен вход"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Токен недействителен или истёк"
                code: "UNAUTHORIZED"
                customData: null
    NotFound:
      description: "Не найдено"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Раздел не найден"
                code: "NOT_FOUND"
                customData: null
    Conflict:
      description: "Звонок ещё не поступил"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Звонок ещё не поступил"
                code: "VERIFICATION_PENDING"
                customData: null
    TooManyRequests:
      description: "Слишком частый повтор"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Повторно запросить код можно через 42 сек."
                code: "TOO_MANY_REQUESTS"
                customData: null
    Unavailable:
      description: "Не настроено на сайте или ожидает реализации"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          example:
            status: "error"
            data: null
            errors:
              - message: "Функция ожидает реализации на сайте"
                code: "SERVICE_UNAVAILABLE"
                customData: null
  schemas:
    SuccessEnvelope:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "success"
        data: {}
        errors:
          type: "array"
          items: {}
          maxItems: 0
      required:
        - "status"
        - "data"
        - "errors"
    ErrorEnvelope:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "error"
        data:
          nullable: true
          example: null
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/Error"
      required:
        - "status"
        - "data"
        - "errors"
    Error:
      type: "object"
      properties:
        message:
          type: "string"
          description: "Текст на русском, можно показать пользователю"
        code:
          type: "string"
          enum:
            - "VALIDATION_ERROR"
            - "UNAUTHORIZED"
            - "FORBIDDEN"
            - "NOT_FOUND"
            - "INTERNAL_ERROR"
            - "SERVICE_UNAVAILABLE"
            - "PROMO_CODE_INVALID"
            - "AUTH_CODE_INVALID"
            - "VERIFICATION_EXPIRED"
            - "VERIFICATION_PENDING"
            - "TOO_MANY_REQUESTS"
          description: "VALIDATION_ERROR, PROMO_CODE_INVALID, AUTH_CODE_INVALID, VERIFICATION_EXPIRED → 400; UNAUTHORIZED → 401; FORBIDDEN → 403; NOT_FOUND → 404; VERIFICATION_PENDING → 409; TOO_MANY_REQUESTS → 429; INTERNAL_ERROR → 500; SERVICE_UNAVAILABLE → 503 (не настроено или ожидает реализации на сайте)"
        customData:
          type: "object"
          nullable: true
          description: "Например {field: \"limit\"} или {retryAfter: 42}"
      required:
        - "message"
        - "code"
    Ping:
      type: "object"
      properties:
        apiVersion:
          type: "string"
          example: "v1"
        serverTime:
          type: "string"
          format: "date-time"
      required:
        - "apiVersion"
        - "serverTime"
    Image:
      type: "string"
      format: "uri"
