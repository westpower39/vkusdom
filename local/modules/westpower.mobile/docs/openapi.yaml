openapi: 3.0.3
info:
  title: ВкусДом — API мобильного приложения
  version: 1.0.0
  description: |
    Публичное API для мобильного приложения ВкусДом.

    **Формат ответа.** Любой ответ — конверт `{status, data, errors}`:
    при успехе `status = "success"`, полезная нагрузка в `data`, `errors = []`;
    при ошибке `status = "error"`, `data = null`, в `errors` — список ошибок, HTTP-код соответствует коду первой ошибки.

    **Общие правила контракта**
    1. Списки — в `items`; постраничные списки дополнительно содержат `pagination`.
    2. Ссылка на другую сущность — объект `Ref {id, name}`, не плоское поле `xxxId`.
    3. Поля в camelCase; везде `name` (не `title`), дочерние элементы — `children`.
    4. Коды (подборки, сортировки, метки, фильтры) — строки в kebab-case.
    5. Нет значения → `null` (поле присутствует); пустой список → `[]`.
    6. ID — integer (исключение — временные объекты, например верификация телефона: UUID-строка). Деньги — number (2 знака), валюта в объекте цены. Даты — ISO 8601 с часовым поясом. Вес — граммы.
    7. Картинка — абсолютный URL оригинала или `null`.
    8. Булевы флаги — с префиксом `is`/`has`.
    9. HTTP-методы: GET — чтение; PUT — установить состояние ресурса по известному адресу (повтор безопасен);
       DELETE — удалить (повтор не ошибка); POST — создать новое или выполнить действие.
    10. Тело запроса — JSON (`Content-Type: application/json`), поля в camelCase.
    11. Параметр пути `{id}` — ID самого ресурса; `{productId}`, `{code}` — если ресурс адресуется через другую сущность.
    12. Персональные данные зависят от заголовка `Authorization: Bearer <token>`.
    13. `errors[].message` — текст на русском, можно показывать пользователю.

    **Авторизация (ТЗ 8.5).** Каталог и контент — без токена (с токеном карточки получают isFavorite и cartQuantity).
    Корзина и расчёт оформления — с гостевым или пользовательским токеном (`POST /auth/guest`).
    Избранное, заказы, профиль — только после входа (`POST /auth/login`). access-токен короткий (15 мин),
    refresh-токен — 30 дней: при 401 вызовите `POST /auth/refresh`.

    **Списки товаров.** Товары без розничной цены в списки, поиск и фильтры не попадают (настройка модуля);
    недоступные товары всегда идут в конце списка при любой сортировке.

    **Заглушки.** Методы с пометкой «ожидает реализации на сайте» отвечают 503 SERVICE_UNAVAILABLE
    (запись) или пустыми данными (чтение) — контракт не изменится, когда сайт их реализует.
servers:
  - url: "https://vkusdom.westpower.ru/api/v1"
    description: "Тестовый стенд"
tags:
  - name: "system"
  - name: "content"
  - name: "catalog"
  - name: "auth"
  - name: "cart"
  - name: "favorites"
  - name: "checkout"
  - name: "orders"
  - name: "profile"
paths:
  "/ping":
    get:
      tags:
        - "system"
      summary: "Проверка доступности API"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Ping"
  "/home":
    get:
      tags:
        - "content"
      summary: "Главный экран: блоки по порядку (server-driven)"
      description: "Приложение рисует блоки по `type`: banners → GET /banners, promotions → GET /promotions, brands → GET /brands, products → GET /catalog/collections/{collection.code}/products, sections → GET /catalog/collections/{collection.code}/sections. Порядок, названия и видимость настраиваются в админке; блоки без содержимого не возвращаются."
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/HomeLayout"
  "/banners":
    get:
      tags:
        - "content"
      summary: "Большие баннеры (мобильные слайды)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/BannerList"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/promotions":
    get:
      tags:
        - "content"
      summary: "Акции (маленькие баннеры)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/PromotionList"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/promotions/{id}":
    get:
      tags:
        - "content"
      summary: "Детальная акции с товарами"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/PromotionDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Id"
      security:
        - {}
        - bearerAuth: []
  "/brands":
    get:
      tags:
        - "content"
      summary: "Бренды"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/BrandList"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/pages":
    get:
      tags:
        - "content"
      summary: "Страницы «Клиентской службы» (webview)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/PageList"
  "/catalog/sections":
    get:
      tags:
        - "catalog"
      summary: "Дерево каталога (2 уровня)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/SectionTree"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/catalog/sections/{id}":
    get:
      tags:
        - "catalog"
      summary: "Детальная раздела"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/SectionDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Id"
  "/catalog/sections/{id}/products":
    get:
      tags:
        - "catalog"
      summary: "Товары раздела (с подразделами)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProductList"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Id"
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Sort"
        - "$ref": "#/components/parameters/Filter"
      security:
        - {}
        - bearerAuth: []
  "/catalog/sections/{id}/filters":
    get:
      tags:
        - "catalog"
      summary: "Фильтры и сортировки раздела"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Filters"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Id"
        - "$ref": "#/components/parameters/Filter"
  "/catalog/collections/{code}/products":
    get:
      tags:
        - "catalog"
      summary: "Товары подборки"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/CollectionProducts"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      description: "Пока подборке не назначено содержимое в админке, `items` пустой — блок нужно скрыть."
      parameters:
        - "$ref": "#/components/parameters/ProductCollectionCode"
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Sort"
        - "$ref": "#/components/parameters/Filter"
      security:
        - {}
        - bearerAuth: []
  "/catalog/collections/{code}/filters":
    get:
      tags:
        - "catalog"
      summary: "Фильтры и сортировки подборки"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Filters"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/ProductCollectionCode"
        - "$ref": "#/components/parameters/Filter"
  "/catalog/collections/{code}/sections":
    get:
      tags:
        - "catalog"
      summary: "Подборка разделов (плитки)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/CollectionSections"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/SectionCollectionCode"
  "/catalog/products":
    get:
      tags:
        - "catalog"
      summary: "Поиск товаров по названию"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProductList"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Query"
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Sort"
        - "$ref": "#/components/parameters/Filter"
      security:
        - {}
        - bearerAuth: []
  "/catalog/products/filters":
    get:
      tags:
        - "catalog"
      summary: "Фильтры для результатов поиска"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Filters"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Query"
        - "$ref": "#/components/parameters/Filter"
  "/catalog/products/{id}":
    get:
      tags:
        - "catalog"
      summary: "Детальная товара"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProductDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
        - "$ref": "#/components/parameters/Id"
      security:
        - {}
        - bearerAuth: []
  "/auth/guest":
    post:
      tags:
        - "auth"
      summary: "Гостевая сессия (корзина без входа)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Tokens"
  "/auth/verifications":
    post:
      tags:
        - "auth"
      summary: "Начать подтверждение телефона"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Verification"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/Unavailable"
      description: "SMS — стандартный механизм Битрикса. Вход звонком ожидает реализации на сайте (503). В тестовом режиме SMS не отправляется, код фиксированный, звонок подтверждается сразу."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/VerificationRequest"
  "/auth/verifications/{id}":
    get:
      tags:
        - "auth"
      summary: "Статус подтверждения (для звонка — опрашивать раз в 2–3 с)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Verification"
        '404':
          "$ref": "#/components/responses/NotFound"
      parameters:
        - "$ref": "#/components/parameters/VerificationId"
  "/auth/login":
    post:
      tags:
        - "auth"
      summary: "Вход по подтверждённому телефону"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/LoginResult"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/Unavailable"
      description: "Если передан гостевой токен, гостевая корзина переносится пользователю."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      security:
        - {}
        - bearerAuth: []
  "/auth/refresh":
    post:
      tags:
        - "auth"
      summary: "Обновить токены"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Tokens"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
  "/auth/logout":
    post:
      tags:
        - "auth"
      summary: "Выход (отзыв токенов)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        nullable: true
                        example: null
      security:
        - bearerAuth: []
  "/cart":
    get:
      tags:
        - "cart"
      summary: "Корзина"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []
    delete:
      tags:
        - "cart"
      summary: "Очистить корзину"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []
  "/cart/items/{productId}":
    put:
      tags:
        - "cart"
      summary: "Установить количество товара (0 — удалить)"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
      parameters:
        - "$ref": "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CartItemRequest"
      security:
        - bearerAuth: []
    delete:
      tags:
        - "cart"
      summary: "Удалить товар из корзины"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      parameters:
        - "$ref": "#/components/parameters/ProductId"
      security:
        - bearerAuth: []
  "/cart/promo-codes":
    post:
      tags:
        - "cart"
      summary: "Применить промокод"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      description: "Несуществующий код → 400 PROMO_CODE_INVALID. Существующий, но не подходящий по условиям, добавляется со статусом `not-applied`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PromoCodeRequest"
      security:
        - bearerAuth: []
  "/cart/promo-codes/{code}":
    delete:
      tags:
        - "cart"
      summary: "Убрать промокод"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Cart"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      parameters:
        - "$ref": "#/components/parameters/PromoCode"
      security:
        - bearerAuth: []
  "/favorites":
    get:
      tags:
        - "favorites"
      summary: "Избранное"
      responses:
        '200':
          description: "OK"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SuccessEnvelope"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProductList"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Limit"
      security:
        - bearerAuth: []
  "/favorites/{productId}":
    put:
      tags:
        - "favorites"
      summary: "Добавить в избранное"
      responses:
        '200':
          description: "OK"
          content:
